<html>
    <head>
        <title>1位の紹介</title>
    </head>
    <body>
        <h1>1位は○○です</h1>

        <img id="pic" src="rank1.jpg" width="300">
        <br>
        <button onclick="big()">大きくする</button>
        <button onclick="small()">小さくする</button>
        <button id="darkBtn" onclick="darkMode()">モード変更</button>

        <p>
            ○○のおすすめポイントは・・・。
        </p>

        <a href="index.html">
            おすすめ3選へもどる
        </a>
        <script>
        let size = 300;
        function big() {
            if(size < 600) {
                size = size + 50;
            }
            document.getElementById("pic").width = size;
        }
        function small() {
            if(size > 100) {
                size = size - 50;
            }
            document.getElementById("pic").width = size;
        }

        let dark = false;

        function darkMode() {
            const btn = document.getElementById("darkBtn");
            if(dark == false) {
                document.body.style.backgroundColor = "black";
                document.body.style.color = "white";
                document.querySelector('a').style.color = "lightblue";
                btn.textContent = "☀️ ライトモード";
                dark = true;
            }
            else {
                document.body.style.backgroundColor = "white";
                document.body.style.color = "black";
                document.querySelector('a').style.color = "";
                btn.textContent = "🌙 ダークモード";
                dark = false;
            }
        } 
        </script>
    </body>
</html>
